<svg width="24" height="24" viewBox="0 0 24 24" fill="#000" xmlns="http://www.w3.org/2000/svg">
  <!-- A tally: four strokes and the one struck through them. The Manual
       provider is a count the user keeps by hand, and a tally is the mark of
       exactly that. Drawn rather than borrowed from any vendor, so it can
       never be read as somebody's logo. Solid fill; rendered as a template. -->
  <rect x="4" y="3.5" width="2.6" height="17" rx="1.3"/>
  <rect x="8.6" y="3.5" width="2.6" height="17" rx="1.3"/>
  <rect x="13.2" y="3.5" width="2.6" height="17" rx="1.3"/>
  <rect x="17.8" y="3.5" width="2.6" height="17" rx="1.3"/>
  <rect x="0.6" y="10.7" width="22.8" height="2.6" rx="1.3" transform="rotate(-28 12 12)"/>
</svg>
