<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* The palette. Dark is the notch as it has always been drawn; light is the same shapes in the
     inks Settings already uses, plus the Mac's own light secondary (#6b6b6b, Palette.textSecondary).
     Which of the two is drawn is Rust's answer to get_theme_resolved, never a guess made here. */
  :root{
    --pill:#000; --edge:#2e2e2e; --rest-edge:#5c5c5c; --card:#0a0a0a; --card-line:#242424; --card-rule:#1e1e1e;
    --bar:#2d2d2d; --track:#303030; --hole:#2a2a2a;
    --ample:#00FF88; --watch:#F2FF00; --crit:#FF3F00;
    --ink:#ffffff; --ink-2:#e8e8ea; --ink-3:#c8c8c8; --ink-4:#b0b0b3; --ink-dim:#808080;
    --btn:#252525; --btn-line:#555; --btn-hover:#383838; --btn-line-hover:#aaa;
  }
  /* Rust resolves the choice — Light, Dark, or what Windows is set to — and the page is told, rather
     than reading prefers-color-scheme: correcting a live window's theme does not reliably reach
     WebView2's own scheme, which left a dark page under a light Mica. */
  :root[data-theme="light"]{
    --pill:#f5f5f7; --edge:#d2d2d7; --rest-edge:#86868b; --card:#ffffff; --card-line:#e4e4e8; --card-rule:#e8e8ec;
    --bar:rgba(0,0,0,.15); --track:rgba(0,0,0,.16); --hole:#ffffff;
    /* Palette.ample and .watch carry a light value of their own; .critical is "already 3.5:1 on
       white", in its words, so it is the one band that does not change. */
    --ample:#00A356; --watch:#B08800; --crit:#FF3F00;
    --ink:#1d1d1f; --ink-2:#1d1d1f; --ink-3:#3c3c43; --ink-4:#4a4a4f; --ink-dim:#6b6b6b;
    --btn:#ffffff; --btn-line:#c6c6cc; --btn-hover:#f0f0f2; --btn-line-hover:#8e8e93;
  }
  .c-auth{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .c-auth button{font:inherit;font-size:11px;color:var(--ink);background:var(--btn);border:1px solid var(--btn-line);border-radius:7px;padding:6px 9px;cursor:pointer}
  .c-auth button:hover,.c-auth button:focus-visible{background:var(--btn-hover);border-color:var(--btn-line-hover)}
  .c-auth button:disabled{opacity:.5;cursor:wait}
  .c-auth-status{font-size:10px;line-height:1.4;color:var(--ink-3);margin-top:6px;overflow-wrap:anywhere}
  /* Visual reference: upstream docs/specs/2026-08-28-usage-notch-design.md, reproduced for Windows */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
  #root{position:relative;width:100%;height:100%}

  /* The pill on the right edge */
  #pill{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:70px;padding:18px 0;background:var(--pill);
    border-radius:20px 0 0 20px;
    /* Stays visible on dark wallpapers: a thin stroke plus a faint glow, the only outline when black sits on black */
    border:1px solid var(--edge);border-right:none;
    box-shadow:none;
    display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;
  }
  /* Fillets: the concave arcs between the pill's top/bottom and the screen edge (the inverse rounded
     corner in the upstream design frame). An R×R black square hugs the edge and a radial gradient
     punches out the circle of radius R centred on its outer corner; what remains is the arc. A 1 px
     ring in the stroke colour joins the pill's own stroke (the outline cue on black wallpapers). */
  #pill::before,#pill::after{
    content:"";position:absolute;right:0;width:var(--fillet);height:var(--fillet);pointer-events:none;
  }
  /* The Mac's flare radius (38.7 pt against the same 70 pt body), so the settings orb that nests in
     this pocket can be the Mac's own size */
  #pill{--fillet:38.7px}
  #pill::before{
    top:calc(-1 * var(--fillet)); /* covers the 1 px stroke along the pill's top edge so there is no seam */
    background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px));
  }
  #pill::after{
    bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px));
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  /* The ring takes the Mac's own share of the body, NotchLayout.ringDiameter against sideBodyDepth: 44 in
     70. At 56 it left an outside weekly ring 2.8 px from the screen edge, where the Mac keeps it about 10
     clear ("far enough in that the bezel is never touched"). The arcs are drawn in a 56-unit viewBox and
     scale with the ring on their own; the glyphs are sized here in px, so they take the same factor. */
  :root{--ring:44px;--k:calc(44 / 56)}
  .ringwrap{position:relative;width:var(--ring);height:var(--ring);transition:transform .3s cubic-bezier(.34,1.4,.64,1)}
  .ringwrap.pressed{transform:scale(.93)}
  .ringwrap > svg.ring,.ringwrap > svg.reading,.ringwrap > svg.activity{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:calc(20px * var(--k));font-weight:700;color:var(--ink-2);letter-spacing:-.5px;
  }
  .glyph.small{font-size:calc(15px * var(--k))}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:calc(26px * var(--k));height:calc(26px * var(--k));color:var(--ink-2)}
  .glyph .mark svg{width:calc(26px * var(--k));height:calc(26px * var(--k));fill:currentColor} /* inline SVG follows currentColor, so it dims together with the cell */
  .glyph img.png{width:calc(26px * var(--k));height:calc(26px * var(--k));object-fit:contain}
  .glyph img.appicon{width:calc(30px * var(--k));height:calc(30px * var(--k));border-radius:calc(8px * var(--k));object-fit:cover}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:var(--ink-2);margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .pct{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .dim{opacity:.55}
  /* A stale reading dims the reading only. The track, the week and the glyph are all saying the same
     old thing, but whether an agent is running right now is current either way, so the activity arc
     keeps its strength — the Mac puts its own ActivityArc outside the opacity it gives the stale
     stack (ProviderRing), and TASKS.md says it outright: dimming applies to the usage reading. */
  .ringwrap.stale > svg.ring,.ringwrap.stale > svg.reading,.ringwrap.stale > .glyph{opacity:.55}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* A 60 fps SVG transform animation in a transparent always-on-top window slows the whole desktop
     compositor (other apps stutter). steps() drops repaints to ~10 fps; it still reads as spinning/breathing. */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}
  /* Windows' Animation effects switch: a still arc and a solid ring, as on the Mac under Reduce Motion */
  @media (prefers-reduced-motion: reduce){.arc-spin,.arc-pulse{animation:none}.ringwrap{transition:none}}

  /* Hover card, shown to the left of the pill */
  #card{
    position:absolute;left:5px;right:108.7px;top:50%;transform:translateY(-50%);
    /* Anchored on both sides = fluid width: whatever the WebView's real logical width, the card cannot
       extend past the window's left edge (a fixed max-width got clipped when the DPI disagreed).
       The 246 cap matches the upstream spec. */
    max-width:246px;margin-left:auto;background:var(--card);border-radius:16px;padding:16px;
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% - 16px);overflow-x:hidden;overflow-y:auto;scrollbar-width:thin; /* actions stay reachable in a tall card */
    display:none;
  }
  #card.show{display:block}
  /* The tail, its point on the hovered ring: the Mac's curved wedge (TooltipTail), whose shoulders
     leave the card tangent to its edge so the two read as one shape. An element of its own rather
     than ::after, so the card's overflow cannot clip it and it can be reported as hot. The Mac's
     size, 28.2 long and 32.7 across (NotchLayout.tailLength, tailHeight), its tip stopping 10.5
     short of the pill (tailGap): hence the card's 108.7 = the pill's 70 + 10.5 + 28.2. */
  #tail{
    position:absolute;right:80.5px;width:28.2px;height:32.7px;background:var(--card);display:none;
    clip-path:path('M0 0C0 8.18 16.36 12.43 28.2 16.36C16.36 20.29 0 24.54 0 32.72Z');
  }
  #card.show + #tail{display:block}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:var(--ink-dim);margin-bottom:10px}
  .win{margin-top:10px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{color:var(--ink-2);font-weight:600;white-space:nowrap}
  .w-reset{color:var(--ink-dim);font-size:11px;white-space:nowrap;margin-left:auto} /* wrap as a whole when it does not fit; never break inside a word */
  .w-track{height:4px;border-radius:2px;background:var(--bar);margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px}
  .w-used{font-size:11px;color:var(--ink-dim)}
  .g-head{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:12px}
  .g-box{border:1px solid var(--card-line);border-radius:10px;padding:0 10px 8px;margin-top:6px}
  .c-note{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:6px}
  .c-sessions{margin-top:12px;border-top:1px solid var(--card-rule);padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-4);padding:2px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  .s-more{font-size:11px;color:var(--ink-dim);padding:2px 0}

  /* ---- The other three edges -------------------------------------------------
     The rules above draw the right-hand edge, the original layout and still the default. Each block
     below mirrors or rotates that one for another edge. Two things stay in JavaScript because they
     depend on measurement: where the card and the tail sit along the pill (`placeCard`), and, on the
     flat edges, how far down or up the card clears a pill whose thickness follows its contents.

     The fillets follow one rule on every edge: the radial gradient is centred on the corner of the
     R×R square *diagonally opposite* the corner where the pill meets the screen, so what stays black
     is the concave arc between the two. */

  /* Left: the right-hand layout mirrored. */
  body[data-edge="left"] #pill{right:auto;left:0;border-radius:0 20px 20px 0;border-right:1px solid var(--edge);border-left:none}
  body[data-edge="left"] #pill::before,body[data-edge="left"] #pill::after{right:auto;left:0}
  body[data-edge="left"] #pill::before{background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="left"] #pill::after{background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="left"] #card{left:108.7px;right:5px;margin-left:0;margin-right:auto}
  body[data-edge="left"] #tail{right:auto;left:80.5px;clip-path:path('M28.2 0C28.2 8.18 11.84 12.43 0 16.36C11.84 20.29 28.2 24.54 28.2 32.72Z')}

  /* Top and bottom: the pill lies flat, so it is a row and its thickness comes from the cells rather
     than a fixed 70 px column. The card is centred under (or over) the hovered ring by `placeCard`. */
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{
    right:auto;left:50%;top:auto;transform:translateX(-50%);
    flex-direction:row;width:auto;height:auto;padding:12px 18px;
    /* Both ends have a flare here, and each flare's edge line runs on into the pill's own: without this
       one, the far flare's line stopped short at the pill and stood out of it as a stub */
    border-right:1px solid var(--edge);
  }
  body[data-edge="top"] #pill::before,body[data-edge="top"] #pill::after,
  body[data-edge="bottom"] #pill::before,body[data-edge="bottom"] #pill::after{right:auto;top:auto;bottom:auto}
  body[data-edge="top"] #pill{top:0;border-radius:0 0 20px 20px;border-top:none}
  body[data-edge="top"] #pill::before{top:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="top"] #pill::after{top:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 100%, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="bottom"] #pill{bottom:0;border-radius:20px 20px 0 0;border-bottom:none}
  body[data-edge="bottom"] #pill::before{bottom:0;left:calc(-1 * var(--fillet));background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  body[data-edge="bottom"] #pill::after{bottom:0;right:calc(-1 * var(--fillet));background:radial-gradient(circle at 100% 0, transparent calc(var(--fillet) - 1.5px), var(--edge) calc(var(--fillet) - 0.5px), var(--pill) calc(var(--fillet) + 0.5px))}
  /* A fixed width here, not the fluid one the upright edges use: `placeCard` measures the card to
     centre it, and a shrink-to-fit width would change as it moves. 246 is the upstream cap either way. */
  body[data-edge="top"] #card,body[data-edge="bottom"] #card{
    left:8px;right:auto;top:0;transform:none;margin-left:0;
    width:246px;max-height:calc(100% - 150px);
  }
  body[data-edge="top"] #tail,body[data-edge="bottom"] #tail{right:auto;width:32.7px;height:28.2px}
  body[data-edge="top"] #tail{clip-path:path('M0 28.2C8.18 28.2 12.43 11.84 16.36 0C20.29 11.84 24.54 28.2 32.72 28.2Z')}
  body[data-edge="bottom"] #tail{clip-path:path('M0 0C8.18 0 12.43 16.36 16.36 28.2C20.29 16.36 24.54 0 32.72 0Z')}

  /* Show on hover, the Mac's .onHover: folded, the notch rests as a small pill at the edge. Its size is
     the Mac's NotchLayout.pillWidth × pillHeight, 26 × 210 of its design px — 10 × 79 of this page's,
     the same unscaled measures the orb and the fillets use. The open pill keeps its whole layout and is
     clipped down to that, so everything measured off it (the card's anchor, the handles, which ring is
     under the pointer) stays true; `#rest` draws the outline the clip takes away, which is the only
     thing that shows a black pill against a black wallpaper. */
  #pill{--clip-open:inset(-40px -1px -40px -1px round 0);
    --clip-rest:inset(calc(50% - 39.5px) 0 calc(50% - 39.5px) calc(100% - 10px) round 6px 0 0 6px);
    clip-path:var(--clip-open);transition:clip-path .36s cubic-bezier(.32,.72,.24,1)}
  body.folded #pill{clip-path:var(--clip-rest)}
  body[data-edge="left"] #pill{--clip-rest:inset(calc(50% - 39.5px) calc(100% - 10px) calc(50% - 39.5px) 0 round 0 6px 6px 0)}
  body[data-edge="top"] #pill,body[data-edge="bottom"] #pill{--clip-open:inset(-1px -40px -1px -40px round 0)}
  body[data-edge="top"] #pill{--clip-rest:inset(0 calc(50% - 39.5px) calc(100% - 10px) calc(50% - 39.5px) round 0 0 6px 6px)}
  body[data-edge="bottom"] #pill{--clip-rest:inset(calc(100% - 10px) calc(50% - 39.5px) 0 calc(50% - 39.5px) round 6px 6px 0 0)}
  /* That outline is all there is of a pill on a backdrop of its own colour, a black pill on a black
     wallpaper or a light one on a white page, so it has an edge of its own: at least 3:1 against the
     pill's fill in either palette, where --edge is 1.5:1. */
  #rest{position:absolute;box-sizing:border-box;background:var(--pill);border:1px solid var(--rest-edge);pointer-events:none;
    right:0;top:50%;translate:0 -50%;width:10px;height:79px;border-right:none;border-radius:6px 0 0 6px;
    opacity:0;transition:opacity .16s ease,background-color .3s ease,border-color .3s ease}
  body.folded #rest{opacity:1;transition:opacity .2s ease .18s,background-color .3s ease,border-color .3s ease} /* arrives as the clip does */
  /* With Adaptive pill on, it follows what is behind it instead, as the iPhone's home indicator does:
     Rust reads the screen beside it (backdrop.rs) and says which backdrop it is on, and the pill takes
     the palette that stands out there. Until Rust answers, and once it is switched off, Theme decides. */
  body[data-behind="dark"] #rest{--pill:#f5f5f7;--rest-edge:#86868b}
  body[data-behind="light"] #rest{--pill:#000;--rest-edge:#5c5c5c}
  body[data-edge="left"] #rest{right:auto;left:0;border-right:1px solid var(--rest-edge);border-left:none;border-radius:0 6px 6px 0}
  body[data-edge="top"] #rest,body[data-edge="bottom"] #rest{right:auto;left:50%;top:auto;translate:-50% 0;width:79px;height:10px;border:1px solid var(--rest-edge)}
  body[data-edge="top"] #rest{top:0;border-top:none;border-radius:0 0 6px 6px}
  body[data-edge="bottom"] #rest{bottom:0;border-bottom:none;border-radius:6px 6px 0 0}
  /* The rings leave by fading and sliding a little toward the edge, one after another — the Mac's
     NotchMotion.stagger, 28 of its design px (10 here), and no scaling: the clip does the concealing */
  .cell{transition:opacity .18s ease calc(var(--i,0) * 28ms),translate .3s cubic-bezier(.32,.72,.24,1) calc(var(--i,0) * 28ms)}
  body.folded .cell{opacity:0;translate:10px 0}
  body.folded[data-edge="left"] .cell{translate:-10px 0}
  body.folded[data-edge="top"] .cell{translate:0 -10px}
  body.folded[data-edge="bottom"] .cell{translate:0 10px}
  /* Shown as the notch opens, its arc still buried in the notch; gone once the arc is back in */
  .handle{transition:opacity .01s linear}
  body.folded .handle{opacity:0;pointer-events:none;transition:opacity .04s linear .23s}
  @media (prefers-reduced-motion: reduce){#pill,#rest,body.folded #rest,.cell,.handle{transition:none}}

  /* The settings orb past the far end of the pill, as on the Mac (SettingsOrb). At rest it is a
     quarter arc tucked into that fillet's pocket, concentric with it and a gap inside; under the
     pointer the same circle fills in and takes its glyph. The Mac's measures, unscaled: arc radius 28.5, stroke 6.8, disc
     46.6, glyph 21. `placeHandles` puts each box's centre on its fillet's centre. */
  .handle{position:absolute;width:57px;height:57px;display:none;--arc:270deg}
  .handle.placed{display:block}
  .handle.hover{cursor:pointer}
  .handle > *{position:absolute;left:50%;top:50%;pointer-events:none;transition:opacity .2s,transform .36s cubic-bezier(.34,1.3,.64,1)}
  .h-rest{width:72px;height:72px;margin:-36px 0 0 -36px;overflow:visible;transform:rotate(var(--arc)) scale(1)}
  .h-disc{width:46.6px;height:46.6px;margin:-23.3px 0 0 -23.3px;border-radius:50%;background:var(--pill);border:1px solid var(--edge);opacity:0;transform:scale(1.1)}
  .h-ring{stroke:var(--edge)}
  .h-fill{stroke:var(--pill)}
  /* A gear drawn from geometry, its corners rounded by a stroke in its own colour */
  .h-glyph path{stroke:var(--ink-2);stroke-width:1.6;stroke-linejoin:round}
  .h-glyph{width:21px;height:21px;margin:-10.5px 0 0 -10.5px;fill:var(--ink-2);opacity:0;
    transform:rotate(calc(var(--spins,0) * 360deg - 60deg)) scale(.5);transition:opacity .2s,transform .55s cubic-bezier(.34,1.2,.64,1)}
  .handle.hover .h-rest{opacity:0;transform:rotate(var(--arc)) scale(.86)}
  .handle.hover .h-disc{opacity:1;transform:scale(1)}
  .handle.hover .h-glyph{opacity:1;transform:rotate(calc(var(--spins,0) * 360deg)) scale(1)}
  /* The quarter that faces the fillet: up and outward past the far end on the right */
  body[data-edge="left"] #orb,body[data-edge="top"] #orb{--arc:180deg}
  body[data-edge="bottom"] #orb{--arc:90deg}
  @media (prefers-reduced-motion: reduce){.handle > *{transition:none}}
  /* Carried, the orb's parts are drawn frame by frame from the carry's times (drawCarriedHandle) */
  .handle.carried > *{transition:none}
  /* The orb's goo (drawOrb) stands in for the arc and the disc while it runs. Over the pill, unlike
     the orb, so a neck leaving the notch covers the pill's edge line where it crosses it */
  .handle.drawn > .h-rest,.handle.releasing > .h-rest,.handle.releasing > .h-disc{visibility:hidden}
  #orbGoo{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;overflow:visible;pointer-events:none;display:none}
  #orbGoo.placed{display:block}
  #orbGoo{transition:opacity .01s linear}
  body.folded #orbGoo{opacity:0;transition:opacity .04s linear .23s}
  #orbGoo .p-ring{fill:none;stroke:var(--edge);stroke-linecap:round}
  #orbGoo .p-fill{fill:none;stroke:var(--pill);stroke-linecap:round}
  #orbGoo .p-disc{fill:var(--pill);stroke:var(--edge);stroke-width:1}
  #orbGoo .liquid path{fill:none;stroke:#000;stroke-linecap:round}
  #orbGoo .liquid .l-neck,#orbGoo .liquid circle{fill:#000;stroke:none}
  #orbGooF .rim{flood-color:var(--edge)} #orbGooF .fill{flood-color:var(--pill)}
  /* The six dots beside the orb (MoveGrip), drawn centred on the orb and under it, so they come out
     of it and go back into it. Liquid while they come and go: the goo is cut back to a shape and
     drawn in the pill's colour with its edge, as the orb's disc is. */
  #grip{position:absolute;width:166px;height:166px;margin:-83px 0 0 -83px;overflow:visible;pointer-events:none;display:none}
  #grip.placed{display:block}
  body.folded #grip{visibility:hidden}
  #grip .dot{fill:var(--pill);stroke:var(--edge);stroke-width:1}
  #grip .liquid .dot,#grip .liquid .core,#grip .liquid .neck{fill:#000;stroke:none}

// so the palette is read back out of the page instead of written down twice.
function readPalette(){
  const s=getComputedStyle(document.documentElement);
  const v=(name,fallback)=>s.getPropertyValue(name).trim()||fallback;

  AMPLE=v('--ample',AMPLE); WATCH=v('--watch',WATCH); CRIT=v('--crit',CRIT);
}
readPalette();

   var() does not reach it. `dark` is the default the CSS already holds, so a failed ask changes
   nothing rather than leaving the page half-painted. */
function applyTheme(name){
  document.documentElement.dataset.theme = name === 'light' ? 'light' : 'dark';

}
invoke('get_theme_resolved').then(applyTheme).catch(()=>{});
listen('theme_resolved',e=>applyTheme(e.payload)).catch(()=>{});

// Settings' own sliders; a page opened before either invoke resolves draws with the Mac's defaults.
let watchLimit=0.5, criticalLimit=0.7;
const stepTone=f=> f>=criticalLimit?CRIT : f>=watchLimit?WATCH : AMPLE;

  const A=hex3(a), B=hex3(b);
  const ch=i=>Math.round(A[i]+(B[i]-A[i])*t);

}
const rampTone=f=>{
  f=Math.max(0,Math.min(1,f));
  if(f<watchLimit) return lerpHex(AMPLE,WATCH,f/watchLimit);

function smallPct(v){

  if(t>99.9) return '>99.9';
  return t.toFixed(1);
}
function pctText(f){ const v=f*100; return v>0&&v<1?smallPct(v):String(Math.round(v)); }

function usedCopy(w){
  const v=w.used*100;

  else { const u=Math.round(v); used=String(u); left=String(Math.max(0,100-u)); }

}

// "Is it working?" per provider: Claude from the four-state engine, the others from the activity probe. Returns running | attention | idle
function workState(id){

    if(stateSnap.agg==='running') return 'running';
    if(stateSnap.agg==='attention') return 'attention';
    // The engine cannot see cloud sessions: fall back to the desktop app's network activity
    if(activity.some(a=>a.provider==='claude'&&a.state==='busy')) return 'running';
    return 'idle';
  }
  const acts=activity.filter(a=>a.provider===id);
  if(acts.some(a=>a.state==='waiting')) return 'attention';
  if(acts.some(a=>a.state==='busy')) return 'running';

// would have had on their own, so headlineOf and weeklyOf need no rule about accounts. `base` is the
// provider the cell belongs to (glyph, activity, slot choice); `id` is what makes the cell unique.
function claudeCells(){
  const ws=Array.isArray(usage.windows)?usage.windows:[];
  const accounts=[];
  for(const w of ws){
    const g=w.group||'';
    if(!accounts.some(a=>a.g===g)) accounts.push({g:g,slug:(String(w.id).split('@')[1]||'')});
  }
  // One account (or a reading with no headings yet) is the single cell it has always been
  if(accounts.length<2) return [{id:'claude',base:'claude',name:'Claude',glyph:'C',snap:usage}];
  return accounts.map(a=>({
    id:a.slug?'claude@'+a.slug:'claude',
    base:'claude',
    name:a.g||'Claude',
    glyph:'C',
    snap:Object.assign({},usage,{windows:ws.filter(w=>(w.group||'')===a.g)
      .map(w=>Object.assign({},w,{id:String(w.id).split('@')[0]}))})

function providers(){
  const list=claudeCells();

  if(glmSnap.status!=='absent') list.push({id:'glm',base:'glm',name:'z.ai',glyph:'Z.ai',snap:glmSnap});

  if(grokSnap.status!=='absent') list.push({id:'grok',base:'grok',name:'Grok',glyph:'Gk',snap:grokSnap});
  if(copilotSnap.status!=='absent') list.push({id:'copilot',base:'copilot',name:'GitHub Copilot',glyph:'Cp',snap:copilotSnap});

function weeklyOf(snap,id){

  if(id==='claude') return byId('seven_day')||byId('weekly_all')||byId('weekly');

function staleOf(snap){ if(snap.status==='stale') return true; return snap.fetched_at>0 && (Date.now()-snap.fetched_at)>15*60*1000; }

function svgArc(r,frac,color,width,extra=''){
  // Nothing at all at zero: a zero-length dash still paints a dot once the caps are round, where the
  // Mac's `trim(from: 0, to: 0)` draws nothing. A reading small enough that its two caps meet does
  // draw as a dot, on both platforms — `ProviderRing.sweep` has no floor. Upstream #260 argues that
  // is wrong, for the local model's arc; if it lands, the same floor belongs here.
  if(!(frac>0)) return '';
  const C=2*Math.PI*r;
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" stroke-linecap="round"
    transform="rotate(-90 28 28)" ${extra}/>`;
}

// svgArc's sweep drawn as the Mac's dashed weekly ring: 4-on 2-off butt-capped ticks. A circle has
// one dasharray, and svgArc spends it on cropping to `frac`, so the ticks are spelled out up to the
// sweep's end (the last one cut short) and a closing gap takes up the rest of the circumference.
function dashedArc(r,frac,color,width,extra=''){
  if(!(frac>0)) return '';
  const C=2*Math.PI*r, len=C*Math.min(frac,1), seg=4, gap=2, parts=[];
  let pos=0;
  for(;;){
    const d=Math.min(seg,len-pos); pos+=d;
    if(pos+gap>=len){ parts.push(d,C-pos); break; }
    parts.push(d,gap); pos+=gap;
  }
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${parts.map(n=>n.toFixed(2)).join(' ')}" stroke-linecap="butt"
    transform="rotate(-90 28 28)" ${extra}/>`;
}

        const r=weeklyRing==='inside'?16:31;
        const track=weeklyRingDashed
          ?`<circle cx="28" cy="28" r="${r}" fill="none" stroke="${TRACK}" stroke-width="2.4" stroke-dasharray="4 2" opacity="0.7"/>`
          :`<circle cx="28" cy="28" r="${r}" fill="none" stroke="${TRACK}" stroke-width="2.4" opacity="0.7"/>`;
        const arc=weeklyRingDashed
          ?dashedArc(r,Math.min(wk.used,1),tone(wk.used),2.4,'opacity="0.85"')
          :svgArc(r,Math.min(wk.used,1),tone(wk.used),2.4,'opacity="0.85"');
        inner+=track+arc;
      }
    }
    svg.innerHTML=inner;
    { // thin inner arc: spinning white = working, yellow pulse = waiting on you (one animation for all four, different sources)
      // Its own layer, so a stale reading can dim around it without dimming it: see `.ringwrap.stale`
      const ws=workState(p.base);
      if(ws==='running') activity.innerHTML=`<g class="arc-spin">${svgArc(19,0.28,INK,2.5)}</g>`;
      else if(ws==='attention') activity.innerHTML=`<g class="arc-pulse"><circle cx="28" cy="28" r="19" fill="none" stroke="${WATCH}" stroke-width="2.5"/></g>`;
      else activity.innerHTML='';
    }
    if(p.snap.status==='needsAuth'||p.snap.status==='none') pct.textContent='—';
    else if(h && h.count!=null) pct.textContent='~'+h.count;
    else if(h) pct.textContent=(h.derived?'~':'')+pctText(h.used)+'%';
    else pct.textContent=p.snap.windows.length?'—':'…'; // its declared window is missing: a dash, not a wait
    glyph.classList.toggle('dim', !!(h && h.used>=1));
    wrap.classList.toggle('stale', staleOf(p.snap));
  }
  reportHot(); // a provider appearing or leaving resizes the pill
}

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return ui().resetting;
  const min=Math.round(diff/60000); // rounded before the test, so 59m40s never reads "Resets in 60 min"
  if(min<60) return ui().resetsIn(Math.max(1,min));
  const d=new Date(ms), locale=ui().locale;
  // A weekday only names a day in the coming week: a Codex monthly reset 26 days out read as this Monday
  if(daysApart(Date.now(),ms)>=7) return ui().resetsDate(d.toLocaleDateString(locale,{month:'short',day:'numeric'}));
  const t=d.toLocaleTimeString(locale,{hour:'numeric',minute:'2-digit',hourCycle:stateSnap.clock_24h?'h23':'h12'});
  if(diff<24*60*60*1000) return ui().resetsAt(t);
  return ui().resetsOn(d.toLocaleDateString(locale,{weekday:'short'}),t);
}
// Calendar days rather than 24-hour blocks, so a clock change cannot move the answer
function daysApart(from,to){
  const day=ms=>{const d=new Date(ms); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();};
  return Math.round((day(to)-day(from))/86400000);
}

function ago(ms){
  const m=Math.round((Date.now()-ms)/60000);
  return ui().ago(m);
}

const STATE_DOT={running:INK,attention:WATCH,done:AMPLE,idle:TRACK};
// The card is clipped, not scrolled, so rows past this would push its title off the top; the rest are counted, as on the Mac
const SESSION_ROWS=5;
function moreRow(n){ return n>0?`<div class="s-more">${ui().andMore(n)}</div>`:''; }

let hoverId='claude';
let claudeAuth={busy:false,message:''};
let claudeActionMessage='';
// CLAUDE_AUTH_ACTIONS_START
// Only while signed out, where the Mac shows its sign-in line; and only on the default account,
// since the CLI's login runs without CLAUDE_CONFIG_DIR and would sign in ~/.claude whichever card asked
function offersClaudeSignIn(p){ return p.id==='claude'&&p.snap.status==='needsAuth'; }
function claudeAuthHtml(auth, message=''){
  return `<div class="c-auth"><button id="claude-sign-in" ${auth.busy?'disabled':''}>${esc(textCopy(auth.busy?'Signing in...':'Sign in'))}</button></div><div class="c-auth-status" role="status">${esc(textCopy(message||auth.message||'Browser sign-in through Claude Code'))}</div>`;
}
async function signInClaude(){
  if(claudeAuth.busy) return;
  claudeActionMessage='';
  try{
    claudeAuth={busy:true,message:'Complete sign-in in the browser or terminal window.'};
    renderCard();
    await invoke('claude_sign_in');
  }catch(e){
    claudeAuth.busy=false;
    claudeActionMessage=String(e?.message||e);
  }
  renderCard();
}
// CLAUDE_AUTH_ACTIONS_END
function renderCard(){
  const c=document.getElementById('card');
  const p=providers().find(x=>x.id===hoverId)||providers()[0];
  const snap=p.snap;
  const headIcon=glyphHtml(p,true);
  // p.name is no longer a constant: for a second account it is built from the home
  // directory's slug and the subscriptionType read out of .credentials.json.
  let html=`<div class="c-head">${headIcon}<span class="c-title">${esc(ui().title(p.name))}</span></div>`;
  if(staleOf(snap)&&snap.fetched_at) html+=`<div class="c-sub">${ui().updated(ago(snap.fetched_at))}</div>`;
  if(snap.status==='needsAuth'){
    const who={claude:'Sign in to Claude Code to see usage.',cursor:'Sign in to Cursor to see usage.',codex:'Sign in to Codex to see usage.',grok:'Run grok login to see usage.',copilot:'Run gh auth login to see usage.',opencode:'Run opencode auth login to see usage.',gemini:'Sign in to Antigravity to see usage.'}[p.base]||'';
    html+=`<div class="c-note">${textCopy(who)}<br>${esc(textCopy(snap.note||''))}</div>`;
  }else if(!snap.windows.length){
    html+=`<div class="c-note">${esc(textCopy(snap.note||'Waiting for first reading…'))}</div>`;
  }else{
    // Windows that share a group (Antigravity's model families) sit in one box under its name, as on the Mac
    let group=null;
    for(const w of snap.windows){
      if((w.group||null)!==group){
        if(group) html+=`</div>`;
        group=w.group||null;
        if(group) html+=`<div class="g-head">${esc(textCopy(group))}</div><div class="g-box">`;
      }
      if(w.count!=null){
        html+=`<div class="win"><div class="w-row"><span class="w-label">${esc(textCopy(w.label))}</span></div>
          <div class="w-used">${w.count>0?`~${w.count} ${textCopy(w.count===1?'request today':'requests today')}`:textCopy('no requests today')}</div></div>`;
        continue;
      }
      html+=`<div class="win">
        <div class="w-row"><span class="w-label">${esc(textCopy(w.label))}</span><span class="w-reset">${resetCopy(w.resets_at)}</span></div>
        <div class="w-track"><div class="w-fill" style="width:${(Math.min(w.used,1)*100).toFixed(0)}%;background:${tone(w.used)}"></div></div>
        <div class="w-used">${esc(usedCopy(w))}</div>
      </div>`;
    }
    if(group) html+=`</div>`;
    if(snap.note) html+=`<div class="c-note">${esc(textCopy(snap.note))}</div>`;
  }
  if(offersClaudeSignIn(p)) html+=claudeAuthHtml(claudeAuth,claudeActionMessage);
  if(p.base==='claude'){ // live sessions (a full list with jump-to-session is a follow-up)
    const act=stateSnap.sessions.filter(s=>s.state!=='idle');
    if(act.length){
      html+=`<div class="c-sessions">`;
      for(const s of act.slice(0,SESSION_ROWS)){
        html+=`<div class="s-row"><span class="s-dot" style="background:${STATE_DOT[s.state]||'#666'}"></span>${esc(s.title)}</div>`;
      }
      html+=moreRow(act.length-SESSION_ROWS)+`</div>`;
    }
  }else{ // other providers: detected activity rows (Cursor reports state; Codex/Antigravity are inferred from recent writes)
    // Waiting before busy, newest first within each, so what gets cut is what matters least
    const acts=activity.filter(a=>a.provider===p.base).sort((a,b)=>(b.state==='waiting')-(a.state==='waiting')||b.since-a.since);
    if(acts.length){
      html+=`<div class="c-sessions">`;
      for(const a of acts.slice(0,SESSION_ROWS)){
        const col=a.state==='waiting'?WATCH:INK;
        html+=`<div class="s-row"><span class="s-dot" style="background:${col}"></span>${esc(a.name)}<span style="color:#808080;margin-left:auto">${esc(textCopy(a.detail))}</span></div>`;
      }
      html+=moreRow(acts.length-SESSION_ROWS)+`</div>`;
    }
  }
  c.innerHTML=html;
  const signIn=c.querySelector('#claude-sign-in');
  if(signIn) signIn.onclick=e=>{e.stopPropagation();signInClaude();};
  placeCard();
}
// The card follows the hovered cell: centred on it along the pill (kept inside the window), tail pointing at it.
// On the upright edges that means matching its vertical centre; on the flat ones, its horizontal centre,
// and the card is pushed clear of a pill whose thickness follows the cells it holds.
// The Mac's NotchLayout.tailGap and tailLength: the tail's tip stops short of the notch, as the CSS above has it
const TAIL_GAP=10.5, TAIL_LENGTH=28.2;
function placeCard(){
  // Rects and the viewport come back zoomed when fitZoom has zoomed the page; offsetWidth/Height and
  // the styles written here are not, so the rects are brought back first, as placeHandles does. Mixed,
  // a page zoomed past 1 put the bottom edge's card down behind the pill, which then hid all but its top.
  const z=parseFloat(document.documentElement.style.zoom)||1;
  const box=el=>{ const r=el.getBoundingClientRect(); return {left:r.left/z,top:r.top/z,bottom:r.bottom/z,width:r.width/z,height:r.height/z}; };
  const cell=pill.querySelector(`.cell[data-p="${hoverId}"]`)||pill;
  const cr=box(cell);
  // The point sits on the ring, not the cell, which includes the label below it
  const rr=box(cell.querySelector('.ringwrap')||cell);
  card.style.transform='none';
  if(edgeIsVertical()){
    const cy=cr.top+cr.height/2;
    const H=innerHeight/z, ch=card.offsetHeight||0;
    let top=Math.round(cy-ch/2); top=Math.max(8+insets[0],Math.min(top,H-insets[2]-ch-8));
    card.style.top=top+'px'; card.style.left='';
    const ry=rr.top+rr.height/2;
    const th=tail.offsetHeight||33, ty=Math.max(top+16+th/2,Math.min(top+ch-16-th/2,ry));
    tail.style.top=Math.round(ty-th/2)+'px'; tail.style.left='';
  }else{
    const pr=box(pill);
    const cx=cr.left+cr.width/2;
    const W=innerWidth/z, cw=card.offsetWidth||0, ch=card.offsetHeight||0;
    let left=Math.round(cx-cw/2); left=Math.max(8+insets[3],Math.min(left,W-insets[1]-cw-8));
    card.style.left=left+'px';
    const rx=rr.left+rr.width/2;
    const tw=tail.offsetWidth||33, tx=Math.max(left+16+tw/2,Math.min(left+cw-16-tw/2,rx));
    tail.style.left=Math.round(tx-tw/2)+'px';
    // The upright edges' gap, turned: the tail's tip TAIL_GAP clear of the pill, the card past the tail
    if(notchEdge==='top'){ card.style.top=Math.round(pr.bottom+TAIL_GAP+TAIL_LENGTH)+'px'; tail.style.top=Math.round(pr.bottom+TAIL_GAP)+'px'; }
    else{ card.style.top=Math.round(pr.top-TAIL_GAP-TAIL_LENGTH-ch)+'px'; tail.style.top=Math.round(pr.top-TAIL_GAP-TAIL_LENGTH)+'px'; }
  }
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* Hover: stays expanded while either the pill or the card is under the cursor; collapses after a 250 ms grace period (upstream motion rule) */
const card=document.getElementById('card'), pill=document.getElementById('pill'), tail=document.getElementById('tail');
let hideTimer=null;
function showCard(){clearTimeout(hideTimer);card.classList.add('show');renderCard();armWatchdog();refreshClock();} // show first, then render: placeCard needs offsetHeight
// Nothing is broadcast when the Windows clock format changes, so ask again each time the card opens
function refreshClock(){
  invoke('get_state').then(s=>{
    if(!s||s.clock_24h===stateSnap.clock_24h) return;
    stateSnap.clock_24h=s.clock_24h;
    if(card.classList.contains('show')) renderCard();
  }).catch(()=>{});
}
function hideCard(){card.classList.remove('show');reportHot();}
function scheduleHide(){clearTimeout(hideTimer);hideTimer=setTimeout(hideCard,250);}
// ===== Diagnostics + geometry =====
function jslog(m){invoke('log_js',{msg:String(m)}).catch(()=>{});}
function callq(cmd,args){ // invoke with visible failure: any command error is reported on screen (a silent .catch used to swallow them)
  return invoke(cmd,args).catch(e=>{notice(cmd+' failed: '+(e&&e.message||e));throw e;});
}
// Hot rectangles are reported in physical pixels (multiplied by this page's real DPR), so the Rust side does no conversion — WebView2's DPR and the window scale can disagree
function rectOf(el){const r=el.getBoundingClientRect(),k=window.devicePixelRatio||1;return [r.left*k,r.top*k,r.width*k,r.height*k];}
/* The tail and the gap between its tip and the pill: crossing it is still being on the notch, so it is
   hot too, or a click there would go through to whatever is behind. */
function tailReach(){
  const t=tail.getBoundingClientRect(), p=pill.getBoundingClientRect(), k=window.devicePixelRatio||1;
  let {left,top,right,bottom}=t;
  if(notchEdge==='left') left=Math.min(left,p.right);
  else if(notchEdge==='top') top=Math.min(top,p.bottom);
  else if(notchEdge==='bottom') bottom=Math.max(bottom,p.top);
  else right=Math.max(right,p.left);
  return [left*k,top*k,(right-left)*k,(bottom-top)*k];
}
/* Rust gates click-through on these, so they are reported whenever the pill or card moves, not only
   when the card opens: a stale pill rectangle is a pill that cannot be clicked. */
function reportHot(){
  if(folded){ callq('set_hot',{rects:[wakeRect()],expanded:false,probe:probeRect()}).catch(()=>{}); return; }
  const open=card.classList.contains('show');
  const rects=open?[rectOf(pill),tailReach(),rectOf(card)]:[rectOf(pill)];
  if(placeHandles()){ rects.push(rectOf(orb)); if(gripOut()||handleCarry) rects.push(gripRect()); }
  callq('set_hot',{rects,expanded:open}).catch(()=>{});
}
/* What wakes the folded notch: the resting pill, as long along the edge as the pill and deepened into
   the screen by the Mac's pillHotZone — Design.px(90), 34 here — because the pill is small and the
   place that opens it should not be (NotchViewModel.wakeLength and wakeDepth). */
const WAKE_BAND=34;
function wakeRect(){
  const r=document.getElementById('rest').getBoundingClientRect(), k=window.devicePixelRatio||1;
  const b=WAKE_BAND*(parseFloat(document.documentElement.style.zoom)||1); // rects come back zoomed
  let x=r.left,y=r.top,w=r.width,h=r.height;
  if(notchEdge==='left') w+=b; else if(notchEdge==='top') h+=b; else if(notchEdge==='bottom'){ y-=b; h+=b; } else { x-=b; w+=b; }
  return [x*k,y*k,w*k,h*k];
}
/* The strip of screen Rust reads to choose the resting pill's colour: beside the pill, on the side away
   from the edge, where nothing is drawn while folded. */
const PROBE_GAP=4, PROBE_DEPTH=12;
function probeRect(){
  const r=document.getElementById('rest').getBoundingClientRect(), k=window.devicePixelRatio||1;
  const z=parseFloat(document.documentElement.style.zoom)||1, g=PROBE_GAP*z, d=PROBE_DEPTH*z;
  let x=r.left-g-d,y=r.top,w=d,h=r.height;
  if(notchEdge==='left') x=r.right+g;
  else if(notchEdge==='top'){ x=r.left; y=r.bottom+g; w=r.width; h=d; }
  else if(notchEdge==='bottom'){ x=r.left; y=r.top-g-d; w=r.width; h=d; }
  return [x*k,y*k,w*k,h*k];
}
function armWatchdog(){
  requestAnimationFrame(reportHot); // wait one frame so renderCard's new content is laid out before measuring
}
// Viewport fit (pure front-end fallback, independent of Rust): Rust sizes and zooms the window so this
// page is as wide as the design, so if the CSS viewport is not that wide the WebView's DPR disagrees
// with the monitor; CSS zoom pulls the layout back to the design size.
// The design width is the window's, and the window is not the same shape on every edge — see
// `notch_window_size` in main.rs: NOTCH_W upright, NOTCH_LONG lying flat. Dividing by 360 on a
// flat edge read the wider window as a DPR error and zoomed the whole notch by 520/360. Either number
// left behind when the window changes width does the same thing, so a test in main.rs pins both.
const DESIGN_W_UPRIGHT=360, DESIGN_W_FLAT=650;
function designWidth(){ return edgeIsVertical()?DESIGN_W_UPRIGHT:DESIGN_W_FLAT; }
function fitZoom(){
  const z=innerWidth/designWidth();
  document.documentElement.style.zoom=(Math.abs(z-1)>0.02)?String(z):'';
  return z;
}
// `settled` only from the end of a burst of resizes, which is what a landing waits for (land_on_another_screen)
function reportDpr(settled){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)}`);
  callq('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight,settled:settled===true}).catch(()=>{});
}
// Not measured yet: the width to measure against depends on the edge, and only Rust knows it. The
// ask is at the bottom of this file and answers in a round trip; measuring first would zoom a flat
// window by 520/360 for that moment.
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(()=>{reportDpr(true);reportHot();},120);});
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',()=>reportDpr());
// A landing on a screen at another scale: empty the page, which leaves the transparent window
// invisible while it is resized and re-zoomed, and say so once that has painted — hiding the window
// itself would pause the page, and the re-zoom would then happen in plain view
listen('notch_landing',()=>{
  document.documentElement.style.visibility='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>invoke('notch_hidden').catch(()=>{})));
}).catch(()=>{});
listen('notch_reveal',()=>{
  document.documentElement.style.visibility='';
  if(carried){
    carried=false;
    // Released a moment ago, as far as the squeeze is concerned: the drawing had it spring back already
    if(handleCarry&&!handleCarry.landedAt){ handleCarry.releasedAt=Date.now()-400; handleCarry.landedAt=Date.now(); runGrip(); }
    requestAnimationFrame(()=>requestAnimationFrame(()=>invoke('carry_revealed').catch(()=>{})));
  }
}).catch(()=>{});

/* Collapse test: no trust in element-level mouseenter/mouseleave/e.target at all —
   pure geometry: is the cursor (clientX/Y) inside pill rect ∪ card rect ∪ their bounding box?
   Leaving the window: document mouseout (relatedTarget=null) plus the Rust watchdog (system cursor) as a second line. */
function inRect(x,y,r,pad){return x>=r.left-pad&&y>=r.top-pad&&x<r.right+pad&&y<r.bottom+pad;}
function cellAt(x,y){
  for(const el of pill.querySelectorAll('.cell')){ if(inRect(x,y,el.getBoundingClientRect(),6)) return el.dataset.p; }
  return null;
}
function pointerInHot(x,y){
  const p=pill.getBoundingClientRect();
  if(inRect(x,y,p,4))return true;
  if(!card.classList.contains('show'))return false;
  const c=card.getBoundingClientRect();
  if(inRect(x,y,c,4))return true;
  const u={left:Math.min(p.left,c.left),top:Math.min(p.top,c.top),right:Math.max(p.right,c.right),bottom:Math.max(p.bottom,c.bottom)};
  return inRect(x,y,u,0);
}
let hideLogged=0;
document.addEventListener('mousemove',e=>{
  // Folded, the page is sent events only over the pill, so any movement at all is the pointer reaching it
  if(folded){ pointerIn=true; unfold(); }
  if(dragging)return; // no card while dragging
  setHovered(onHandle(e.clientX,e.clientY));
  if(hovered){ if(card.classList.contains('show')){ clearTimeout(hideTimer); hideCard(); } return; }
  const hot=pointerInHot(e.clientX,e.clientY);
  if(hot){
    clearTimeout(hideTimer);
    const id=cellAt(e.clientX,e.clientY);
    if(id&&id!==hoverId){ hoverId=id; if(card.classList.contains('show')){ renderCard(); armWatchdog(); } }
    if(!card.classList.contains('show')) showCard();
  }
  else if(card.classList.contains('show')){ if(hideLogged++<5) jslog(`mousemove left the hot area -> collapse at ${e.clientX},${e.clientY}`); scheduleHide(); }
});
document.addEventListener('mouseout',e=>{ // relatedTarget null = the cursor left the page
  if(!e.relatedTarget && card.classList.contains('show')){ if(hideLogged++<5) jslog('mouseout left the page -> collapse'); scheduleHide(); }
});
listen('pointer_left',()=>{clearTimeout(hideTimer);hideCard();}).catch(()=>{});
// Card content changes change its height -> report the hot rectangles again
listen('usage',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
listen('state',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
/* The pill can be dragged up and down the right edge. Press and move more than 4 px = drag (handed to Rust,
   which follows the system cursor; the card is collapsed first); release without moving = click (refetches that ring). */
let press=null, dragging=false;
/* As on the Mac, a clicked ring presses in until its reading lands, and the reading turns once.
   Each provider's reading listener below calls settle() for its ring; PRESS_MAX is only the fallback.
   Rust answers false when no reading is coming (Claude inside its rate-limit wait). */
const PRESS_MIN=380, PRESS_MAX=6000;
const refreshing={};
function refreshRing(id){
  if(refreshing[id]) return;
  refreshing[id]={at:Date.now(),timer:setTimeout(()=>settle(id),PRESS_MAX)};
  renderRing();
  turnReading(id);
  // The cell id addresses the DOM, the provider id addresses Rust: a second Claude
  // account's cell is `claude@work`, which no command answers to.
  const provider=(providers().find(p=>p.id===id)||{}).base||id;
  invoke('refresh_ring',{provider}).then(coming=>{if(!coming)settle(id);}).catch(()=>settle(id));
}
// The reading has a layer of its own that renders never replace, turned as a whole element so the
// compositor can run it; it finishes its turn whenever the press lets go
function turnReading(id){
  const el=pill.querySelector(`.cell[data-p="${id}"] svg.reading`);
  if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(el.getAnimations().some(a=>a.playState==='running')) return;
  el.animate([{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{duration:950,easing:'cubic-bezier(.32,0,.14,1)'});
}
function settle(id){
  const r=refreshing[id]; if(!r) return;
  clearTimeout(r.timer);
  const wait=r.at+PRESS_MIN-Date.now();
  if(wait>0){ r.timer=setTimeout(()=>settle(id),wait); return; }
  delete refreshing[id];
  renderRing();
}
// Alt+drag, the Mac's ⌥-drag: round the screen's border, drawn by carry.html meanwhile. Without Alt
// a press on the pill is only ever a click — a ring refreshes (#244) — so one that slips can no
// longer carry the notch off (#251).
pill.addEventListener('mousedown',e=>{ if(e.button!==0||folded)return; press={x:e.clientX,y:e.clientY,id:cellAt(e.clientX,e.clientY)||hoverId,alt:e.altKey}; });
document.addEventListener('mousemove',e=>{
  if(!press||dragging||!press.alt)return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true; clearTimeout(hideTimer); hideCard();
    const handle=beginHandleCarry(false);
    invoke('begin_carry',{shape:{...carryShape(),handle}}).catch(err=>{notice('begin_carry failed: '+err);dragging=false;endHandleCarry();});
  }
});
/* This notch as the overlay draws it in the hand, on either kind of edge: a column standing upright,
   a row lying flat, the same cells laid out the two ways the CSS above does — so it is measured
   from the cells, not from the pill, which is only ever one of the two. Borders included. */
function carryShape(){
  const cells=[...pill.querySelectorAll('.cell')], n=Math.max(1,cells.length);
  const cw=cells[0]?cells[0].offsetWidth:44, ch=cells[0]?cells[0].offsetHeight:70, gap=14, ends=36;
  return {
    radius:20, fillet:parseFloat(getComputedStyle(pill).getPropertyValue('--fillet'))||38.7,
    upright:{depth:70, length:ends+n*ch+(n-1)*gap+2, pitch:ch+gap, inset:34.5},
    flat:{depth:24+ch+1, length:ends+n*cw+(n-1)*gap+2, pitch:cw+gap, inset:12+ch/2},
    cells:cells.map(el=>el.outerHTML)
  };
}
// Emptied once the overlay has this notch drawn, and shown again where it was put down, after which
// the overlay can go — so between them there is never a frame with neither
let carried=false;
listen('carry_hold',()=>{ carried=true; document.documentElement.style.visibility='hidden'; }).catch(()=>{});
document.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  if(press&&!dragging&&press.id) refreshRing(press.id);
  press=null;
});
// The Mac's right-click menu, naming the ring or card under the pointer; WebView2's own menu never shows
document.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(dragging||!pointerInHot(e.clientX,e.clientY)) return;
  // The command returns once the menu has closed, which is when folding may be thought about again
  menuOpen=true;
  invoke('show_notch_menu',{provider:cellAt(e.clientX,e.clientY)||hoverId}).catch(err=>notice('show_notch_menu failed: '+err))
    .finally(()=>{ menuOpen=false; scheduleFold(); });
});
listen('drag_end',()=>{
  dragging=false; press=null; document.body.style.cursor=hovered==='grip'?'grab':'';
  if(handleCarry&&!handleCarry.landedAt){ handleCarry.landedAt=Date.now(); runGrip(); }
  reportHot(); scheduleFold();
}).catch(()=>{});

function notice(msg){
  const n=document.getElementById('notice');
  n.textContent=msg;n.classList.add('show');
  clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove('show'),6000);
}

/* ---- The handles ----------------------------------------------------------
   The settings orb past the far end of the pill, and beside it, further along, the six dots that
   carry the notch (the Mac's SettingsOrb and MoveGrip): the dots come out of the orb like goo while
   it is under the pointer, and stay out while the pointer is on them. Placed whenever the hot
   rectangles are reported, since those follow every change to the pill. Hover is a circle round
   each, as on the Mac, not the whole box; the card gives way while either is under the pointer.
   A click on the orb opens Settings; holding the dots carries the notch, as Alt+drag does. */
const orb=document.getElementById('orb');
const HANDLE_REACH=28.5; // the Mac's hot zone, half of 57
let orbAt=null, hovered=null, orbSpins=0;
// The grip (NotchLayout's): a dot, dot centre to dot centre, the orb's disc and the gap from it, and
// the grip's hot zone. Its middle is the disc, the gap and half its own width out. Smaller than the
// Mac's 7.15 and 11.66 and 7 further from the orb than its 4.89, which crowded the orb here.
const grip=document.getElementById('grip'), gripDots=document.getElementById('gripDots');
const gripBlur=grip.querySelector('feGaussianBlur');
const [gripCore,gripNeck,...gripDot]=gripDots.children;
// The orb's goo, placed with the dots (see drawOrb)
const orbGoo=document.getElementById('orbGoo'), orbCut=orbGoo.querySelector('#orbCut circle');
let orbFillet=38.7;
const GRIP_DOT=6.1, GRIP_PITCH=9.9, GRIP_GAP=11.9, DISC_R=23.3, GRIP_HOT=26.3;
const GRIP_WIDTH=GRIP_PITCH+GRIP_DOT, GRIP_REACH=DISC_R+GRIP_GAP+GRIP_WIDTH/2;
let gripAt=null;
function put(el,x,y,z){
  el.style.left=(x/z-HANDLE_REACH)+'px'; el.style.top=(y/z-HANDLE_REACH)+'px';
  el.classList.add('placed');
  return {x,y,reach:HANDLE_REACH*z};
}
// The orb hangs off the pill's far end on every edge, so away from the notch is on along the edge
const away=()=>edgeIsVertical()?[0,1]:[1,0];
function placeHandles(){
  const r=pill.getBoundingClientRect();
  if(!r.width) return false;
  // Measurements come back zoomed when fitZoom has zoomed the page; styles are written unzoomed
  const z=parseFloat(document.documentElement.style.zoom)||1;
  const R=(parseFloat(getComputedStyle(pill).getPropertyValue('--fillet'))||38.7)*z;
  // The fillet's centre: the corner of its square diagonally opposite the one on the screen edge. The
  // square is placed from the pill's padding box, so the border at that end is not part of it
  const cs=getComputedStyle(pill), bb=(parseFloat(cs.borderBottomWidth)||0)*z, br=(parseFloat(cs.borderRightWidth)||0)*z;
  const far=notchEdge==='left'?[r.left+R,r.bottom-bb+R]:notchEdge==='top'?[r.right-br+R,r.top+R]
    :notchEdge==='bottom'?[r.right-br+R,r.bottom-R]:[r.right-R,r.bottom-bb+R];
  orbAt=put(orb,far[0],far[1],z);
  grip.style.left=(far[0]/z)+'px'; grip.style.top=(far[1]/z)+'px';
  grip.classList.add('placed');
  orbGoo.style.left=grip.style.left; orbGoo.style.top=grip.style.top;
  orbGoo.classList.add('placed');
  orbFillet=R/z; orbCut.setAttribute('r',(orbFillet+.5).toFixed(2));
  const [dx,dy]=away();
  gripAt={x:far[0]+dx*GRIP_REACH*z,y:far[1]+dy*GRIP_REACH*z,reach:GRIP_HOT*z};
  return true;
}
function near(at,x,y){ return !!at&&Math.hypot(x-at.x,y-at.y)<=at.reach; }
const gripOut=()=>hovered==='orb'||hovered==='grip';
function gripRect(){
  const k=window.devicePixelRatio||1, g=gripAt;
  return [(g.x-g.reach)*k,(g.y-g.reach)*k,2*g.reach*k,2*g.reach*k];
}
// The dots can only be taken while they are out, so reaching for them means passing the orb first
function onHandle(x,y){ return near(orbAt,x,y)?'orb':(gripOut()&&near(gripAt,x,y))?'grip':null; }
function setHovered(which){
  if(which===hovered) return;
  const wasOut=gripOut();
  hovered=which;
  // Held open while the pointer is on its dots, so the pair stay together
  orb.classList.toggle('hover',gripOut());
  document.body.style.cursor=which==='grip'?'grab':'';
  if(gripOut()!==wasOut){ gripTo(gripOut()); reportHot(); if(gripOut()) holdOrb(); else releaseOrb(); }
  gripHover.to=which==='grip'?1:0;
  runGrip();
}
document.addEventListener('mouseout',e=>{ if(!e.relatedTarget&&!dragging) setHovered(null); });
orb.addEventListener('click',e=>{
  if(!near(orbAt,e.clientX,e.clientY)) return;
  orb.style.setProperty('--spins',++orbSpins);
  pressIn(orb);
  callq('open_settings').catch(()=>{});
});
// The Mac's press: down fast, back with a little bounce
function pressIn(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.animate([{transform:'scale(1)',easing:'ease-out'},{transform:'scale(.84)',offset:.21,easing:'cubic-bezier(.34,1.56,.64,1)'},{transform:'scale(1)'}],{duration:430});
}

/* The dots' own motion (NotchRootView.gripDivide, gripReturn and gripHover): out on a drawn-out ease
   a beat after the orb, so there is an orb to come out of; back in quicker; swelling to meet the
   pointer on a quick, springy spring. */
function bezier(x1,y1,x2,y2){
  const at=(t,a,b)=>3*a*t*(1-t)*(1-t)+3*b*t*t*(1-t)+t*t*t;
  return x=>{
    if(x<=0) return 0; if(x>=1) return 1;
    let lo=0,hi=1,t=x;
    for(let i=0;i<24;i++){ t=(lo+hi)/2; if(at(t,x1,x2)<x) lo=t; else hi=t; }
    return at(t,y1,y2);
  };
}
const GRIP_OUT=bezier(.35,0,.25,1), GRIP_IN=bezier(.42,0,1,1);
function springStep(gap,velocity,elapsed,response,damping){
  const omega=2*Math.PI/response; let moved=0;
  for(let i=0;i<2;i++){ const dt=elapsed/2; velocity+=(omega*omega*(gap-moved)-2*damping*omega*velocity)*dt; moved+=velocity*dt; }
  return {moved,velocity};
}
const still=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let gripSep=0, gripRun=null, gripFrame=0, gripLast=null;
const gripHover={v:0,velocity:0,to:0};
function gripTo(out){
  gripRun={from:gripSep,to:out?1:0,start:performance.now()+(out?20:0),dur:out?420:200,ease:out?GRIP_OUT:GRIP_IN};
  runGrip();
}
function runGrip(){ if(!gripFrame) gripFrame=requestAnimationFrame(gripTick); }
function gripTick(t){
  gripFrame=0;
  const elapsed=gripLast==null?1/60:Math.min(Math.max((t-gripLast)/1000,0),1/30);
  gripLast=t;
  const hidden=carried&&handleCarry&&!handleCarry.landedAt;
  let busy=!!handleCarry&&!hidden;
  if(gripRun){
    const u=still()?1:Math.min(Math.max((t-gripRun.start)/gripRun.dur,0),1);
    gripSep=gripRun.from+(gripRun.to-gripRun.from)*gripRun.ease(u);
    if(u<1) busy=true; else gripRun=null;
  }
  const gap=gripHover.to-gripHover.v;
  if(still()||(Math.abs(gap)<.002&&Math.abs(gripHover.velocity)<.02)){ gripHover.v=gripHover.to; gripHover.velocity=0; }
  else { const s=springStep(gap,gripHover.velocity,elapsed,.22,.55); gripHover.v+=s.moved; gripHover.velocity=s.velocity; busy=true; }
  if(arcRun){
    const u=still()?1:clamp01((t-arcRun.start)/arcRun.dur);
    arcSep=arcRun.from+(arcRun.to-arcRun.from)*arcRun.ease(u);
    if(u<1) busy=true; else { arcSep=arcRun.to; arcRun=null; }
  }
  if(release){ if(still()||t>=release.start+release.dur){ release=null; orb.classList.remove('releasing'); } else busy=true; }
  if(!hidden){ drawGrip(); drawOrb(t); }
  if(handleCarry&&handleCarry.landedAt&&Date.now()-handleCarry.landedAt>HANDLE_SETTLES) endHandleCarry();
  if(busy) runGrip(); else gripLast=null;
}

const smooth=x=>{ const t=Math.min(Math.max(x,0),1); return t*t*(3-2*t); };
function gripOffsets(){
  // Two lines of three, each running out from the screen's edge
  const v=edgeIsVertical(), pts=[];
  for(const line of [-.5,.5]) for(const row of [-1,0,1]){ const a=line*GRIP_PITCH, c=row*GRIP_PITCH; pts.push(v?[c,a]:[a,c]); }
  return pts;
}
function setCircle(el,x,y,r){ el.setAttribute('cx',x.toFixed(2)); el.setAttribute('cy',y.toFixed(2)); el.setAttribute('r',Math.max(r,0).toFixed(2)); }

/* Out of the orb like goo (MoveGrip): one drop pushes out of the orb's edge on a neck, runs out to
   where the dots go, and divides into the six as the neck lets go; back, the same the other way.
   Liquid only while they come and go, so the dots arrive crisp and apart. */
function drawGrip(){
  if(handleCarry){ drawCarriedHandle(); return; }
  gripDots.style.opacity='';
  const t=gripSep, [dx,dy]=away();
  gripDots.style.display=t>.01?'':'none';
  if(t<=.01) return;
  const start=DISC_R*.6, pull=GRIP_REACH*.18*Math.sin(Math.PI*Math.min(t/.8,1));
  const out=start+(GRIP_REACH-start)*smooth(t/.6)+pull, mx=dx*out, my=dy*out;
  const goo=3*(1-smooth((t-.42)/.36)), liquid=goo>.3;
  gripDots.classList.toggle('liquid',liquid);
  if(liquid){ gripDots.setAttribute('filter','url(#gripGoo)'); gripBlur.setAttribute('stdDeviation',goo.toFixed(2)); }
  else gripDots.removeAttribute('filter');
  // A piece of the orb, inside its edge on the dots' side, for the neck to swell out of
  const core=liquid?DISC_R*.55*smooth(t/.15):0;
  setCircle(gripCore,dx*(DISC_R-core),dy*(DISC_R-core),core);
  // Each fat while it is still part of the drop, its own size once divided off, one a beat after another
  const dot=GRIP_DOT/2*(1+.3*gripHover.v);
  gripOffsets().forEach(([ox,oy],i)=>{
    const s=smooth((t-.32-.015*i)/.4);
    setCircle(gripDot[i],mx+ox*s,my+oy*s,dot*(1+1.9*(1-s))*smooth(t/.12));
  });
  const neck=GRIP_WIDTH*.55*(1-smooth((t-.25)/.35));
  if(!liquid||neck<=.5){ gripNeck.setAttribute('d',''); return; }
  const fx=dx*(DISC_R-2), fy=dy*(DISC_R-2), cx=(fx+mx)/2, cy=(fy+my)/2, px=-dy, py=dx;
  const side=(x,y,half,sign)=>`${(x+px*half*sign).toFixed(2)} ${(y+py*half*sign).toFixed(2)}`;
  const base=GRIP_WIDTH*.8, top=GRIP_WIDTH*.5;
  gripNeck.setAttribute('d',`M${side(fx,fy,base/2,1)} Q${side(cx,cy,neck/2,1)} ${side(mx,my,top/2,1)} L${side(mx,my,top/2,-1)} Q${side(cx,cy,neck/2,-1)} ${side(fx,fy,base/2,-1)} Z`);
}

/* ---- The handle's end of a carried notch (CarriedHandle) ---------------------
   Taken by its dots: the orb into the notch, and the dots, squeezed in the hand, into its place.
   Taken by Alt+drag: the orb's arc gives way to the dots. Let go, they spring back; put down, the
   same run backwards. Worked out from the carry's times alone, never from animations started here:
   carry.html draws this end while the notch is in the hand, and the two hand over at any moment of
   it, so both have to show the same frame. carry.html holds an identical copy of handleFrame. */
const HANDLE_SETTLES=500; // Carry.settles
let handleCarry=null;
const clamp01=x=>Math.min(Math.max(x,0),1);
function handleFrame(c,now){
  const easeOut=x=>{ const u=1-clamp01(x); return 1-u*u*u; };
  const easeOutBack=x=>{ const t=clamp01(x)-1; return 1+2.5*t*t*t+1.5*t*t; };
  const t=(now-c.at)/1000;
  const slide=easeOutBack((t-.12)/.36);
  let squeeze=easeOut(t/.26);
  if(c.releasedAt) squeeze*=1-easeOutBack((now-c.releasedAt)/1000/.34);
  let merged=smooth(t/.3), held=slide, dots=1, arc=0, gear=1-smooth(t/.1), grow=0;
  if(c.landedAt){
    const v=(now-c.landedAt)/1000;
    if(c.fromHover){ merged*=1-smooth(v/.32); held*=1-easeOutBack(v/.36); gear=Math.max(gear,smooth((v-.16)/.16)); grow=smooth(v/.3); }
    else { dots=1-smooth(v/.24); arc=easeOutBack((v-.06)/.34); }
  }
  return {t,slide,squeeze,merged,held,dots,arc,gear,grow};
}
function drawCarriedHandle(){
  const c=handleCarry, f=handleFrame(c,Date.now()), [dx,dy]=away();
  gripDots.style.display=''; gripDots.classList.remove('liquid'); gripDots.removeAttribute('filter');
  setCircle(gripCore,0,0,0); gripNeck.setAttribute('d','');
  const shift=c.fromHover?GRIP_REACH*(1-f.held):0;
  const scale=c.fromHover?1:.4+.6*f.slide;
  const r=GRIP_DOT/2*(1-.3*f.squeeze)*(1+.3*f.grow)*scale, pitch=(1-.18*f.squeeze)*scale;
  gripOffsets().forEach(([ox,oy],i)=>setCircle(gripDot[i],dx*shift+ox*pitch,dy*shift+oy*pitch,r));
  gripDots.style.opacity=clamp01(c.fromHover?1:f.slide)*f.dots;
  const [rest,disc,glyph]=['.h-rest','.h-disc','.h-glyph'].map(q=>orb.querySelector(q));
  orb.classList.add('carried');
  if(c.fromHover){
    rest.style.opacity=0;
    const merging=f.merged>.001;
    disc.style.opacity=merging?0:1;
    glyph.style.opacity=f.gear;
    paintOrb(merging?discMerge(f.merged,orbFillet,ORB_STROKE,DISC_R,pocket()):null);
  } else {
    paintOrb(null);
    const arc=c.landedAt?clamp01(f.arc):1-smooth(f.t/.2);
    const size=c.landedAt?.6+.4*f.arc:1-.4*smooth(f.t/.25);
    rest.style.opacity=arc; rest.style.transform=`rotate(var(--arc)) scale(${size})`;
    disc.style.opacity=0; glyph.style.opacity=0;
  }
}
function beginHandleCarry(fromHover){
  // The notch is open for a carry, so the arc is out; whatever the orb was doing gives way to it
  release=null; arcRun=null; arcSep=1;
  orb.classList.remove('drawn','releasing');
  handleCarry={at:Date.now(),fromHover};
  runGrip();
  // With the dots' and the disc's own measures, so the overlay draws the same dots and disc
  return {at:handleCarry.at,fromHover,dot:GRIP_DOT,pitch:GRIP_PITCH,reach:GRIP_REACH,disc:DISC_R,stroke:ORB_STROKE};
}
function endHandleCarry(){
  const fromHover=handleCarry.fromHover;
  handleCarry=null;
  orb.classList.remove('carried');
  for(const el of orb.children){ el.style.opacity=''; el.style.transform=''; }
  paintOrb(null);
  // Put down by its dots, they stay out beside the orb while the pointer rests where it let go
  gripRun=null; gripSep=fromHover?1:0;
  hovered=fromHover?'grip':null;
  gripHover.v=gripHover.to=fromHover?1:0;
  orb.classList.toggle('hover',fromHover);
  document.body.style.cursor=fromHover?'grab':'';
  drawGrip(); reportHot();
}
// Held from the press, not the first movement: taking hold of it is itself the carry beginning
grip.parentElement.addEventListener('mousedown',e=>{
  if(e.button!==0||hovered!=='grip'||!near(gripAt,e.clientX,e.clientY)||dragging) return;
  e.stopPropagation(); e.preventDefault();
  dragging=true; clearTimeout(hideTimer); hideCard();
  document.body.style.cursor='grabbing';
  const handle=beginHandleCarry(true);
  invoke('begin_carry',{shape:{...carryShape(),handle}}).catch(err=>{ notice('begin_carry failed: '+err); dragging=false; endHandleCarry(); });
},true);

/* ---- The orb's goo (the Mac's GooArc, DiscToArc and DiscMerge) ----------------------------------
   The arc does not fade with the notch: as it opens, a drop pushes out of the flare on a neck, lets
   go and unrolls into the arc; before it folds, the arc rolls up and a neck draws it back in. Left,
   the disc waits for the dots to run back into it, then flows out along the arc; taken by its dots,
   it is drawn into the notch on a neck. The Mac's is black on black; here it is drawn over the pill
   and cut back to the fillet's circle, so nothing of it shows inside the notch. */
const orbInk=document.getElementById('orbInk'), orbBlur=orbGoo.querySelector('feGaussianBlur');
const [plainInk,liquidInk]=orbInk.children, [pRing,pFill,pDisc]=plainInk.children, [lBand,lNeck,lArc,lDisc]=liquidInk.children;
const ARC_R=28.5, ORB_STROKE=6.8;
// NotchRootView's arcDivides, arcReturn and arcQuickReturn, and SettingsOrb.turnsBack
const ARC_DIVIDES=340, ARC_RETURN=400, ARC_QUICK=260, TURNS_BACK=500;
const ARC_DIVIDE=bezier(.35,0,.25,1), EASE_IN_OUT=bezier(.42,0,.58,1), EASE_OUT=bezier(0,0,.58,1), RELEASE=bezier(.3,0,.2,1);
let arcSep=1, arcRun=null, arcHome=-Infinity, release=null, tuckTimer=null;
// Into the notch from the fillet's centre: the middle of the quarter the arc lies in
function pocket(){ const s=Math.SQRT1_2; return notchEdge==='right'?[s,-s]:notchEdge==='bottom'?[-s,s]:[-s,-s]; }

/* The part `a` to `b` (0 to 1) of the quarter circle facing `m` round the fillet's centre, `r` out
   and moved by (sx, sy): the Mac's FlareArc, whose flare is a circle here */
function quarter(m,r,a,b,sx=0,sy=0){
  const th=Math.atan2(m[1],m[0])-Math.PI/4;
  const p=s=>`${(sx+r*Math.cos(th+s*Math.PI/2)).toFixed(2)} ${(sy+r*Math.sin(th+s*Math.PI/2)).toFixed(2)}`;
  return `M${p(a)} A${r.toFixed(2)} ${r.toFixed(2)} 0 0 1 ${p(b)}`;
}
/* A neck of goo from `f` to `t`, half `base` wide where it leaves, `pinch` in its middle and `top`
   where it holds on */
function strand(f,t,base,pinch,top){
  const dx=t[0]-f[0], dy=t[1]-f[1], l=Math.max(Math.hypot(dx,dy),.001), px=-dy/l, py=dx/l, mid=[f[0]+dx/2,f[1]+dy/2];
  const side=(p,h,s)=>`${(p[0]+px*h*s).toFixed(2)} ${(p[1]+py*h*s).toFixed(2)}`;
  return `M${side(f,base,1)} Q${side(mid,pinch,1)} ${side(t,top,1)} L${side(t,top,-1)} Q${side(mid,pinch,-1)} ${side(f,base,-1)} Z`;
}
/* DiscMerge: the disc drawn along a neck into the flare, smaller as it goes. Round the fillet's
   centre, for a fillet `F`, the arc's stroke `S`, the disc's radius `D` and `m` into the notch. */
function discMerge(t,F,S,D,m){
  t=clamp01(t);
  const goo=5*smooth(t/.2), at=o=>[m[0]*(F-o),m[1]*(F-o)];
  const inside=at(-D*.75), k=smooth(t), c=[inside[0]*k,inside[1]*k], r=D*(1-.72*smooth((t-.2)/.8));
  const g={goo,liquid:goo>.3,disc:[c[0],c[1],r]};
  if(!g.liquid) return g;
  const band=S*2.4, hold=smooth(t/.22);
  g.band={d:quarter(m,F+.5+band/2,0,1),width:band};
  if(hold>.02) g.neck=strand(at(-S),c,D*1.1*hold/2,r*.8*hold/2,r*1.2*hold/2);
  return g;
}
/* GooArc: at 0 buried in the notch, at 1 the resting arc. `returning` is the way back in — rolled
   up first, then drawn home on a neck — and `quick` that way with the notch already folding, when
   there is nothing to go into and it only rolls up and dwindles where it is. */
function gooArc(sep,returning,quick,F,S,m){
  if(sep<=.001) return null;
  const rest=F-ARC_R, t=clamp01(sep), rq=returning&&quick, buried=-(rest+S*1.4);
  const goo=rq?0:returning?S*.45*(1+.8*(1-smooth((sep-.04)/.32)))*smooth((.93-sep)/.15)*smooth(sep/.05)
    :S*.4*smooth(sep/.15)*(1-smooth((sep-.6)/.35));
  const slide=rq?0:returning?buried*(1-t)+(t<.85?rest*1.2*Math.sin(Math.PI*t/.85):0)
    :buried*(1-t)+(t<.8?rest*2.1*Math.sin(Math.PI*t/.8):0);
  const unrolled=rq?smooth((sep-.05)/.9):returning?smooth((sep-.6)/.35):smooth((sep-.52)/.43);
  let width=S*2.3+(S-S*2.3)*unrolled;
  if(rq) width=S*smooth(sep/.7);
  if(returning&&!quick) width*=smooth(sep/.35);
  if(width<.4) return null;
  const half=Math.max(.004,unrolled/2), whole=unrolled>=.999;
  const g={goo,liquid:goo>.2,arc:{d:quarter(m,ARC_R,whole?0:.5-half,whole?1:.5+half,-m[0]*slide,-m[1]*slide),width}};
  if(!g.liquid) return g;
  g.arc.width+=goo*.4;
  const neck=returning?(quick?0:S*1.1*smooth((.94-sep)/.1)):S*1.1*(1-smooth((sep-.2)/.5));
  if(neck>S*.18){
    const reach=returning?smooth((.92-sep)/.32):1, out=rest+slide;
    const from=[m[0]*(F+S),m[1]*(F+S)], drop=[m[0]*(F-out),m[1]*(F-out)];
    g.neck=strand(from,[from[0]+(drop[0]-from[0])*reach,from[1]+(drop[1]-from[1])*reach],S*1.3,neck/2,S*.7);
  }
  const band=S+goo*1.6;
  g.band={d:quarter(m,F+.5+band/2,0,1),width:band};
  return g;
}
/* DiscToArc: the disc flowing out along the arc from its middle, thinning as it goes, until it is the
   arc. From the disc's own size, edge included, so it takes over from it without a step. */
function discToArc(p,S,D,m){
  p=clamp01(p);
  const onto=smooth(p/.55), half=Math.max(.004,.5*smooth((p-.08)/.82)), from=2*D-2;
  return {goo:0,liquid:false,arc:{d:quarter(m,ARC_R,.5-half,.5+half,-m[0]*ARC_R*(1-onto),-m[1]*ARC_R*(1-onto)),width:from+(S-from)*smooth(p/.8)}};
}
function paintOrb(g){
  if(!g){ orbInk.style.display='none'; return; }
  orbInk.style.display='';
  plainInk.style.display=g.liquid?'none':''; liquidInk.style.display=g.liquid?'':'none';
  const a=g.arc, d=g.disc||[0,0,0];
  if(!g.liquid){
    // The resting arc's own drawing: the edge a pixel either side of the fill
    pRing.setAttribute('d',a?a.d:''); pRing.setAttribute('stroke-width',a?(a.width+2).toFixed(2):'0');
    pFill.setAttribute('d',a?a.d:''); pFill.setAttribute('stroke-width',a?a.width.toFixed(2):'0');
    setCircle(pDisc,d[0],d[1],d[2]-.5);
    return;
  }
  orbBlur.setAttribute('stdDeviation',g.goo.toFixed(2));
  lArc.setAttribute('d',a?a.d:''); lArc.setAttribute('stroke-width',a?(a.width+2).toFixed(2):'0');
  lBand.setAttribute('d',g.band?g.band.d:''); lBand.setAttribute('stroke-width',g.band?g.band.width.toFixed(2):'0');
  lNeck.setAttribute('d',g.neck||'');
  setCircle(lDisc,d[0],d[1],d[2]);
}
function drawOrb(now){
  if(handleCarry) return;
  let g=null, drawn=false;
  if(release){
    const p=RELEASE(clamp01((now-release.start)/release.dur)), m=pocket();
    g=release.home?discMerge(p,orbFillet,ORB_STROKE,DISC_R,m):discToArc(p,ORB_STROKE,DISC_R,m);
  } else if(!gripOut()&&(arcRun||arcSep<1)){
    g=gooArc(arcSep,!!arcRun&&arcRun.returning,!!arcRun&&arcRun.quick,orbFillet,ORB_STROKE,pocket());
    drawn=true;
  }
  orb.classList.toggle('drawn',drawn);
  paintOrb(g);
}
function arcTo(to,run){
  arcRun={from:arcSep,to,returning:false,quick:false,start:performance.now(),...run};
  runGrip();
}
// Out as the notch opens; caught on its way back in, straight back out the way it was going
function arcOut(){
  if(arcRun?arcRun.to===1:arcSep>=1) return;
  if(performance.now()-arcHome<ARC_RETURN) arcTo(1,{returning:true,dur:350,ease:EASE_OUT});
  else { arcSep=0; arcTo(1,{start:performance.now()+ARC_DIVIDES,dur:950,ease:ARC_DIVIDE}); }
}
// Home before the notch folds; `quick` when it is folding already
function arcIn(quick){
  if(arcRun?arcRun.to===0:arcSep<=0) return;
  arcHome=performance.now();
  arcTo(0,{returning:true,quick,dur:quick?ARC_QUICK:ARC_RETURN,ease:EASE_IN_OUT});
}
/* Left, the disc turns back into its arc a beat late, so the dots have run back into it while it is
   still the disc there to take them; with the arc already going home, it goes into the notch instead */
function releaseOrb(){
  if(handleCarry||still()) return;
  const home=(arcRun?arcRun.to:arcSep)<.5;
  release={start:performance.now()+(home?0:100),dur:home?340:400,home};
  orb.classList.add('releasing');
  runGrip();
}
function holdOrb(){ release=null; orb.classList.remove('releasing'); runGrip(); }

/* Show on hover, the Mac's .onHover. It opens on contact and folds a moment after the pointer has gone.
   Rust says which (notch_pointer): once click-through is back on, the page is sent nothing at all. It
   never folds mid-carry, mid-drag or under the right-click menu, all of which take the pointer off the
   notch on purpose — folding under them is what #239's reviewers caught, so it is ruled out here. */
const FOLD_GRACE=450; // NotchWindowController.foldGrace
function foldAllowed(){ return onHover&&!pointerIn&&!dragging&&!menuOpen; }
function setFolded(f){
  if(f===folded) return;
  folded=f;
  if(f){ clearTimeout(hideTimer); hideCard(); arcIn(true); setHovered(null); } else arcOut();
  document.body.classList.toggle('folded',f);
  reportHot();
}
function unfold(){ clearTimeout(foldTimer); clearTimeout(tuckTimer); setFolded(false); arcOut(); }
/* The Mac's order: left from the orb or its dots, the disc turns back into its arc first; then the arc
   goes home, while there is still a notch to go into; and only then does the notch fold */
function scheduleFold(){
  clearTimeout(foldTimer); clearTimeout(tuckTimer);
  if(!onHover){ setFolded(false); arcOut(); return; }
  if(!foldAllowed()){ if(!folded) arcOut(); return; }
  const turnBack=gripOut()?TURNS_BACK:release?Math.max(0,release.start+release.dur-performance.now()):0;
  tuckTimer=setTimeout(()=>{ if(foldAllowed()) arcIn(false); },turnBack);
  foldTimer=setTimeout(()=>{ if(foldAllowed()) setFolded(true); },FOLD_GRACE+turnBack);
}
function applyUiFlags(f){ onHover=!!(f&&f.notch_on_hover); scheduleFold(); }
// Off the notch is off the orb too: once the window is click-through the page may never see it leave
listen('notch_pointer',e=>{
  pointerIn=e.payload===true;
  if(pointerIn) unfold(); else { if(!dragging) setHovered(null); scheduleFold(); }
}).catch(()=>{});
listen('ui_flags',e=>applyUiFlags(e.payload)).catch(()=>{});
listen('pill_backdrop',e=>{
  if(e.payload==='dark'||e.payload==='light') document.body.dataset.behind=e.payload;
  else delete document.body.dataset.behind;
}).catch(()=>{});
invoke('get_ui_flags').then(applyUiFlags).catch(()=>{});

  .catch(e=>notice('listen(usage) failed: '+e));

invoke('get_antigravity').then(u=>{agSnap=u||agSnap;renderRing();}).catch(()=>{});

listen('opencode',e=>{opencodeSnap=e.payload||opencodeSnap;settle('opencode');renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});

// The edge: pushed on every placement (a drag that snapped elsewhere, or Settings), and asked for once
// at startup in case the placement happened before this page was listening.
listen('notch_edge',e=>applyEdge(e.payload)).catch(()=>{});

invoke('get_notch_edge').then(e=>{applyEdge(e);reportDpr();}).catch(()=>reportDpr());

setInterval(renderRing,30_000); // stale state and reset copy move with time
setInterval(async()=>{
  if(!claudeAuth.busy&&!(hoverId==='claude'&&card.classList.contains('show'))) return;
  try{
    const next=await invoke('get_claude_auth');
    if(JSON.stringify(next)!==JSON.stringify(claudeAuth)){
      claudeAuth=next;
      if(hoverId==='claude'&&card.classList.contains('show')){renderCard();armWatchdog();}
    }
  }catch(_){} // Local IPC only; no network requests and no automatic browser launch.
