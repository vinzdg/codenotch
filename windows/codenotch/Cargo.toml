[package]
name = "codenotch"
version = "1.18.0"
edition = "2021"
description = "Codenotch for Windows — usage notch for Claude, Codex, Cursor and Antigravity"
license = "MIT"
repository = "https://github.com/Im-Midi/codenotch-windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# native-tls rather than the default rustls: on Windows that is schannel, the
# OS's own stack, which is what should be trusted to fetch something the machine
# is about to run. (ureq's default features already pull rustls in as well, so
# both are in the binary either way.) zip: the NSIS updater artifact is zipped.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
dirs = "5"
notify = "6"
ureq = { version = "2", features = ["json", "native-tls", "proxy-from-env"] } # proxy-from-env: honour HTTPS_PROXY, so a machine that reaches api.anthropic.com only through a proxy still reads. # native-tls: the Antigravity local bridge's self-signed certificate is accepted for 127.0.0.1 only
native-tls = "0.2"
png = "0.17" # application icon → PNG (provider marks taken from the installed app's resources)
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Cursor's credential lives in state.vscdb (SQLite); bundled = compile the SQLite C sources with the crate, which adds 1–2 minutes to the first build
rusqlite = { version = "0.32", features = ["bundled"] }
# ZCode seals its credentials with AES-256-GCM keyed by SHA-256 (see glm.rs); ring does both,
# and base64 the base64url parts. (ring was already in the transitive closure via rustls.)
ring = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Credentials",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_Globalization",
  "Win32_System_Console",
  "Win32_System_Registry",
] }
