name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    # macOS 26, because this fork still supports it natively. The app's own
    # floor is macOS 14.3 (see project.yml), and the compatibility shims keep
    # that buildable on Xcode 15.4, but only this runner has the macOS 26 SDK
    # the `compiler(>=6.2)` branches need to be compiled and exercised at all.
    # An older image ships an Xcode that cannot even read the project —
    # `objectVersion 77` is a format it does not know.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Printed rather than assumed: when this job fails on a runner image
      # change, the toolchain is the first thing worth seeing.
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check local signing detection
        run: bash Scripts/test-signing.sh

      # Unsigned on purpose: no identity exists on a runner, and the tests
      # read fixtures rather than keychains — see `make test-ci`.
      - name: Run unit tests
        run: make test-ci

      - name: Verify SwiftPM resolution
        run: make verify-deps
