name: Package

# Separate from CI on purpose: that job answers "do the tests pass", this one
# answers "can somebody run this without a Mac dev setup". Tying them together
# would mean a failing unit test also removes the only way to try the build.
on:
  push:
    branches: [main]
  pull_request:
  # So a build can be produced from any branch on demand, without pushing to
  # main first — this is the button to press when you just want to try it.
  workflow_dispatch:

# One run at a time per ref, because every run writes the same `build/ci`
# directory and two overlapping runs interleave those steps. Queued rather than
# cancelled so a push is never left without its build; a newer push still
# replaces one waiting.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Unsigned app bundle
    # Read-only: this fork publishes the archive as a workflow artifact and
    # never writes a release. Upstream's own copy keeps its preview release;
    # that step is deliberately absent here, so a force-pushed `main` cannot
    # replace anything a friend might already have downloaded from it.
    permissions:
      contents: read
    # The macOS 26 SDK is the only toolchain that compiles the native branches
    # of the compatibility shims (`compiler(>=6.2)`), so this has to be the new
    # image even though the app itself runs back to macOS 14.3. An older image
    # also cannot read the project at all — `objectVersion 77` is a format it
    # does not know.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Install dependencies
        run: brew install xcodegen

      # Ad-hoc signed and not notarized — see the `build-ci` comment in the
      # Makefile for what that costs the person who runs it. `package-adhoc`
      # builds arm64 and x86_64 in one pass and refuses to write an archive
      # unless both slices are in the app and in the Sparkle framework.
      - name: Build the universal archive
        run: make package-adhoc

      - name: Verify the archive is universal and signed
        run: |
          set -euo pipefail
          APP=build/ci/DerivedData/Build/Products/Release/Codenotch.app
          lipo -archs "$APP/Contents/MacOS/Codenotch"
          lipo -archs "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature=adhoc|flags=' || true
          test -z "$(codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep get-task-allow || true)"

      # Read back rather than assumed: the version comes from project.yml and
      # is in the filename, so the artifact is identifiable months later when
      # several of these are sitting in a downloads folder.
      - name: Read the version
        id: version
        run: |
          echo "value=$(awk -F'"' '/MARKETING_VERSION:/ {print $2}' project.yml)" >> "$GITHUB_OUTPUT"

      # The commit, not just the version, because every push to a branch
      # produces one of these and the version only changes at a release.
      - uses: actions/upload-artifact@v7
        with:
          name: Codenotch-${{ steps.version.outputs.value }}-${{ github.sha }}
          path: |
            build/ci/*.zip
            build/ci/*.zip.sha256
          # Silence here would mean a green run with nothing to download, which
          # is the one failure this workflow exists to prevent.
          if-no-files-found: error

      # Gatekeeper will refuse an ad-hoc signed download, and the instructions
      # for getting past it are not obvious. Putting them on the run's own page
      # keeps them next to the file they apply to.
      - name: Explain how to open it
        run: |
          {
            echo "### Codenotch ${{ steps.version.outputs.value }} — unsigned build"
            echo
            echo "Download the artifact below and unzip it. The \`.zip\` holds the app; the"
            echo "\`.sha256\` file is what to compare it against."
            echo
            echo "This build is ad-hoc signed rather than notarized, so macOS quarantines it."
            echo "After dragging the app to /Applications, clear the quarantine flag once:"
            echo
            echo '```'
            echo "xattr -dr com.apple.quarantine /Applications/Codenotch.app"
            echo '```'
            echo
            echo "If macOS says the app is *damaged*, that is the quarantine flag rather than a bad download — run the command above."
            echo
            echo "Universal binary — Apple Silicon and Intel. Requires macOS 14.3 or later."
            echo "This fork has no update feed: install a new build by downloading it the same way."
          } >> "$GITHUB_STEP_SUMMARY"
