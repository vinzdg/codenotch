name: Windows

# The port under windows/ is Rust, and CI and Package only ever run Xcode, so a
# Windows change could merge on a green check that never compiled it. Its own
# file, so those two stay about the Mac app.
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    if: github.repository == 'vinzdg/codenotch'
    name: Build and test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      # First, and quick: cargo never reads the pages, so a syntax error in
      # their script stays green through the build and ships as an empty
      # window. Node is already on the runner.
      - name: Check the UI pages parse
        run: node scripts/check-ui-scripts.mjs

      - name: Test Claude sign-in controls
        run: node scripts/test-claude-auth-ui.cjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Tauri and the windows crate make a cold build several minutes long.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # Reported rather than enforced: the crate already carries warnings, and
      # failing on them would hold every change hostage to that cleanup.
      - name: Clippy
        run: cargo clippy --all-targets --locked
