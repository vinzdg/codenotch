name: Windows Package

# Separate from Windows for the reason Package is separate from CI: that job
# answers "does the port compile", this one answers "can somebody on Windows
# run it without a Rust toolchain". Until this existed, no release carried a
# Windows file at all.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'windows/**'
      - '.github/workflows/windows-package.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'windows/**'
      - '.github/workflows/windows-package.yml'
  # A v* release is cut from a Mac by `make publish`. This is what puts the
  # Windows installer beside its dmg.
  release:
    types: [published]
  workflow_dispatch:

jobs:
  package:
    # workflow_dispatch is let through so a fork can try the installer before
    # opening a pull request; every other trigger only runs here.
    if: github.repository == 'vinzdg/codenotch' || github.event_name == 'workflow_dispatch'
    name: NSIS installer
    # Only the release step writes anything; `gh release upload` fails without it.
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      # Pinned by commit: this job holds contents: write, and `stable` is a
      # moving branch that would let the action change under us.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Its own target dir for two reasons. The bundler copies resources next to
      # the app in target/release, so a hook built there would be copied onto
      # itself. And Claude Code runs the hook on machines that may have no
      # vcruntime140.dll, so it carries its C runtime; changing RUSTFLAGS in the
      # shared target dir would rebuild the app's whole dependency tree.
      # The app needs no flag: tauri-build already links the runtime statically.
      - name: Build the hook
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p codenotch-hook --target-dir target/hook

      # tauri.bundle.conf.json is merged only here, so a plain `cargo build`
      # never looks for a hook binary that has not been built.
      - name: Build the installer
        working-directory: desktop/codenotch
        run: npx --yes @tauri-apps/cli@2.11.4 build --config tauri.bundle.conf.json -- --locked

      # The bundler names the file after the version, which would change the
      # URL every release. One fixed name lets the README link to
      # releases/latest/download/ and never be edited again.
      - name: Name the installer
        run: |
          $setup = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw "expected one installer, found $($setup.Count)" }
          Copy-Item $setup[0].FullName Codenotch-Setup.exe

      # What someone double-clicking the download gets, on a machine that has
      # never seen Codenotch: the hook beside the app (hooks_install.rs looks
      # for it there, so Install hooks fails without it), and an app that starts.
      - name: Install, run doctor, uninstall
        run: |
          Start-Process -FilePath .\Codenotch-Setup.exe -ArgumentList '/S' -Wait
          $hook = Get-ChildItem $env:LOCALAPPDATA -Filter codenotch-hook.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $hook) { throw 'the installer did not install codenotch-hook.exe' }
          $dir = $hook.DirectoryName
          foreach ($f in 'codenotch.exe', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f is not beside codenotch-hook.exe in $dir" }
          }
          # The app is a GUI-subsystem exe that attaches to its parent's console,
          # so the report may reach either the redirected stdout or doctor.log.
          Start-Process -FilePath (Join-Path $dir 'codenotch.exe') -ArgumentList 'doctor' `
            -RedirectStandardOutput doctor.txt -Wait
          $doctor = "$(Get-Content doctor.txt -Raw)$(Get-Content (Join-Path $env:APPDATA 'codenotch\doctor.log') -Raw -ErrorAction SilentlyContinue)"
          if ($doctor -notmatch 'Codenotch doctor') { throw "codenotch.exe doctor did not run: $doctor" }
          $doctor
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait

      # The commit in the name, because every push produces one of these and
      # the version only changes at a release.
      - uses: actions/upload-artifact@v7
        with:
          name: Codenotch-Setup-${{ github.sha }}
          path: desktop/Codenotch-Setup.exe
          if-no-files-found: error

      # SmartScreen's warning names neither the fix nor the reason, so the
      # run's own page says both, next to the file they apply to.
      - name: Explain how to open it
        run: |
          @(
            '### Codenotch for Windows — unsigned installer'
            ''
            'Download the artifact below, unzip it, and run `Codenotch-Setup.exe`.'
            'It installs for the current user, without administrator rights.'
            ''
            'The installer is not code-signed, so SmartScreen says *Windows protected your PC*'
            'the first time. Choose **More info**, then **Run anyway**.'
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

      # v* only: the rolling `preview` release belongs to Package, which deletes
      # every asset on it each time it refreshes.
      - name: Attach to the release
        if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:TAG Codenotch-Setup.exe --clobber
